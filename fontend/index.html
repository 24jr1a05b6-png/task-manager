<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main Container -->
    <div class="container">

        <!-- Header -->
        <header>
            <h1>Task Manager</h1>
            <p>Organize your work and track your progress</p>
        </header>

        <!-- Add Task Section -->
        <section class="add-task">
            <h2>Add New Task</h2>

            <div class="task-input">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter your task..."
                >

                <button id="addTaskBtn">Add Task</button>
            </div>
        </section>

        <!-- Task Statistics -->
        <section class="task-stats">
            <div class="stat-card">
                <h3 id="totalTasks">0</h3>
                <p>Total Tasks</p>
            </div>

            <div class="stat-card">
                <h3 id="pendingTasks">0</h3>
                <p>Pending</p>
            </div>

            <div class="stat-card">
                <h3 id="completedTasks">0</h3>
                <p>Completed</p>
            </div>
        </section>

        <!-- Tasks List -->
        <section class="tasks-section">
            <h2>My Tasks</h2>

            <div id="taskList">

                <!-- Tasks will appear here using JavaScript -->

            </div>
        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
