<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager - Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f6f8;
        }

        .auth-container {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
        }

        .switch {
            text-align: center;
            margin-top: 20px;
        }

        .switch button {
            background: none;
            color: #333;
            width: auto;
            margin: 0;
            padding: 5px;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="auth-container">

        <h1 id="formTitle">Login</h1>

        <!-- Login Form -->

        <form id="loginForm">

            <div class="form-group">

                <label for="loginEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <div class="form-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

            </div>

            <button type="submit">
                Login
            </button>

        </form>


        <!-- Register Form -->

        <form id="registerForm" style="display: none;">

            <div class="form-group">

                <label for="registerName">
                    Name
                </label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your name"
                    required
                >

            </div>

            <div class="form-group">

                <label for="registerEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <div class="form-group">

                <label for="registerPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                    required
                >

            </div>

            <button type="submit">
                Register
            </button>

        </form>


        <div class="switch">

            <span id="switchText">
                Don't have an account?
            </span>

            <button type="button" id="switchButton">
                Register
            </button>

        </div>


        <div id="message"></div>

    </div>


    <script>

        const loginForm =
            document.getElementById("loginForm");

        const registerForm =
            document.getElementById("registerForm");

        const formTitle =
            document.getElementById("formTitle");

        const switchButton =
            document.getElementById("switchButton");

        const switchText =
            document.getElementById("switchText");

        const message =
            document.getElementById("message");


        const API_URL =
            "http://localhost:5000";


        /* =========================
           SWITCH LOGIN / REGISTER
        ========================= */

        switchButton.addEventListener(
            "click",
            function () {

                if (loginForm.style.display !== "none") {

                    loginForm.style.display = "none";

                    registerForm.style.display = "block";

                    formTitle.textContent = "Register";

                    switchText.textContent =
                        "Already have an account?";

                    switchButton.textContent =
                        "Login";

                } else {

                    loginForm.style.display = "block";

                    registerForm.style.display = "none";

                    formTitle.textContent = "Login";

                    switchText.textContent =
                        "Don't have an account?";

                    switchButton.textContent =
                        "Register";

                }

                message.textContent = "";

            }
        );


        /* =========================
           REGISTER
        ========================= */

        registerForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                const name =
                    document.getElementById("registerName").value;

                const email =
                    document.getElementById("registerEmail").value;

                const password =
                    document.getElementById("registerPassword").value;


                try {

                    const response = await fetch(
                        `${API_URL}/api/register`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                name,
                                email,
                                password
                            })
                        }
                    );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        message.textContent =
                            data.message;

                        return;

                    }


                    message.textContent =
                        "Registration successful! Please login.";

                    registerForm.reset();


                    setTimeout(function () {

                        switchButton.click();

                    }, 1000);


                } catch (error) {

                    console.error(error);

                    message.textContent =
                        "Could not connect to the server.";

                }

            }
        );


        /* =========================
           LOGIN
        ========================= */

        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const email =
                    document.getElementById("loginEmail").value;

                const password =
                    document.getElementById("loginPassword").value;


                try {

                    const response = await fetch(
                        `${API_URL}/api/login`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                email,
                                password
                            })
                        }
                    );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        message.textContent =
                            data.message;

                        return;

                    }


                    // Save JWT token
                    localStorage.setItem(
                        "token",
                        data.token
                    );


                    // Save user information
                    localStorage.setItem(
                        "user",
                        JSON.stringify(data.user)
                    );


                    message.textContent =
                        "Login successful!";


                    setTimeout(function () {

                        window.location.href =
                            "index.html";

                    }, 800);


                } catch (error) {

                    console.error(error);

                    message.textContent =
                        "Could not connect to the server.";

                }

            }
        );

    </script>

</body>

</html>
